name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        # pkg/runtime is excluded: it has no tests of its own (always 0% coverage), and Go's
        # test coverage instrumentation covers the whole resolved package graph of `./...`, not
        # just the literal test targets -- so including it here recompiles pkg/runtime with
        # coverage counters for every test binary that imports it, while pkg/compiler's builder
        # still compiles a plugin's copy of pkg/runtime normally in a separate `go build`
        # subprocess. The two stop being bit-identical, and every test that loads a plugin fails
        # with "plugin was built with a different version of package .../pkg/runtime".
        run: go test $(go list ./... | grep -v '/pkg/runtime$') -coverprofile=coverage.out

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
